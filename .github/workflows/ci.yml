name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    name: App lint and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx expo lint
      - run: npm run typecheck

  database:
    name: Database tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx supabase db start
      - run: npx supabase test db
      - run: npx supabase db lint --level warning

  functions:
    name: Edge Functions typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: >-
          deno check
          supabase/functions/_shared/ai/index.ts
          supabase/functions/scan-meal/index.ts
          supabase/functions/revenuecat-webhook/index.ts
          supabase/functions/razorpay-webhook/index.ts
          supabase/functions/delete-account/index.ts
          supabase/functions/notify/index.ts
          supabase/functions/demo-billing/index.ts
